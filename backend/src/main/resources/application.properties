spring.application.name=hr

# Base PostgreSQL locale (schéma créé par base/init.sql, comptes par base/data.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_hr
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate vérifie seulement que les entités correspondent au schéma, il ne le modifie jamais
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session de connexion (cookie JSESSIONID)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Garde les noms Java tels quels (idDepartement, demandePoste) : PostgreSQL les met en minuscules
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Dépôt de dossier : pièces jointes envoyées en multipart, 30 Mo au total par dossier (contrôlé aussi par le service)
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB

# JSON strict : refuse "50" pour un nombre, 1.5 pour un entier, "" / un nombre / une date-heure pour une date
# (sinon Jackson convertit sans rien dire : 1.5 devient 1, "" devient null)
spring.jackson.default-leniency=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
